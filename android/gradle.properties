org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# android.enableJetifier is intentionally NOT set: every dependency in this
# project (riverpod / shared_preferences / file_picker / webview_flutter /
# share_plus / path_provider / archive / highlight) is AndroidX already, and
# the flag is deprecated in AGP 8 where it only slows down configuration.
android.builtInKotlin=false
android.newDsl=false

# NOTE: org.gradle.java.home is intentionally NOT pinned here.
# Set it in your own android/local.properties or via JAVA_HOME / your IDE so the
# project stays portable across machines. Gradle 8.14 + AGP 8.11 require JDK 17.
